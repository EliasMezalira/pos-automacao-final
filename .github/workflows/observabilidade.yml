name: Pipeline de analise de observabilidade
on: [workflow_dispatch]
permissions:
  issues: write
jobs:
  analise_de_logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
      
      - name: Analisar logs com ia
        env:
          GROQL_API_KEY: ${{ secrets.GROCK_API_KEY }}
        run: |
          LOG_CONTENT=$(cat logs/system.log | tr '\n' ' ')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQL_API_KEY" \
            -d '{
              "model": "llama-3.1-8b-instant",
              "messages": [
                {
                  "role": "system",
                  "content": "Você é especialista em observabilidade, monitoramento e análise de logs."
                },
                {
                  "role": "user",
                  "content": "Analise estes logs e diga se existe erro crítico: '"$LOG_CONTENT"'"
                }
              ]
            }')

          echo "Resposta da api:"
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['choices'][0]['message']['content'] if 'choices' in r else 'Erro ao consultar IA')")
 
          echo "Decisão da IA:"
          echo "$DECISION"

          # Se IA detectar erro crítico
          if echo "$DECISION" | grep -qi "crítico"; then
 
            echo "::error::Erro crítico detectado nos logs"
 
            echo "Criando issue automática..."
 
            # Cria issue automaticamente
            ISSUE_URL=$(gh issue create \
              --title "Erro crítico detectado nos logs" \
              --body "$DECISION")
 
            # Mostra link da issue
            echo "Issue criada:"
            echo "$ISSUE_URL"
 
            # Falha pipeline
            exit 1
 
          fi
 
          echo "Nenhum erro crítico detectado."

  analise_de_traces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
      
      - name: Analisar traces com ia
        env:
          GROQL_API_KEY: ${{ secrets.GROCK_API_KEY }}
        run: |
          TRACE=$(cat traces/api_traces.json | jq -c . | sed 's/"/\\"/g')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQL_API_KEY" \
            -d '{
              "model": "llama-3.1-8b-instant",
              "messages": [
                {
                  "role": "system",
                  "content": "Você é especialista em distributed tracing."
                },
                {
                  "role": "user",
                  "content": "Analise este trace distribuído e identifique gargalos: '"$TRACE"'"
                }
              ]
            }')

          echo "Resposta da api:"
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['choices'][0]['message']['content'])")
 
          echo "$DECISION"
 
          if echo "$DECISION" | grep -qiE "timeout|gargalo|crítico"; then
 
            gh issue create \
              --title "Gargalo detectado em trace distribuído" \
              --body "$DECISION"
 
            exit 1
 
          fi

  analise_de_metricas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
      
      - name: Analisar metricas com ia
        env:
          GROQL_API_KEY: ${{ secrets.GROCK_API_KEY }}
        run: |
          METRICAS=$(cat metrics/processing_metrics.json | jq -c . | sed 's/"/\\"/g')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQL_API_KEY" \
            -d '{
              "model": "llama-3.1-8b-instant",
              "messages": [
                {
                  "role": "system",
                  "content": "Você é um avaliador estrito. Analise o cenário e responda APENAS com a palavra APROVADO ou BLOQUEADO, seguida de uma frase curta de justificativa. Nunca responda em formato JSON ou com métricas de código..\nThresholds críticos:\n- CPU >= 80% → REPROVADO\n- Memory >= 85% → REPROVADO\n- Latency >= 2000ms → REPROVADO\n- Error Rate >= 5% → REPROVADO\nExemplos:\n{\"cpu\":15,\"memory\":30,\"latency_ms\":50,\"error_rate\":0.05} → APROVADO\n{\"cpu\":90,\"memory\":50,\"latency_ms\":100,\"error_rate\":1} → REPROVADO\nResponda APENAS a classificação, nada mais."
                },
                {
                  "role": "user",
                  "content": "$METRICAS"
                }
              ]
            }')

          echo "Resposta da api:"
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['choices'][0]['message']['content'])")
 
          echo "$DECISION"
 
          if echo "$DECISION" | grep -qiE "REPROVADO"; then
 
            ISSUE_URL=$(gh issue create \
              --title "Métricas reprovadas - ação necessária" \
              --body "$DECISION")
 
            echo "$ISSUE_URL"
 
            exit 1
 
          fi
         
          echo "✅ Métricas aprovadas! Pipeline prosseguindo..."
          exit 0