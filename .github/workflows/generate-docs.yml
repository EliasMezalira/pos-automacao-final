name: Gerar Documentação com IA
on:
  push:
permissions:
  contents: write

jobs:
  gerar_documentacao:
      - name: Gerar/Atualizar docs com IA
        env:
          GROCK_API_KEY: ${{ secrets.GROCK_API_KEY }}
        run: |
          python3 - <<'PY'
            import os, json, subprocess, sys

            def read(path, n=4000):
                try:
                    with open(path, encoding='utf-8') as f:
                        return f.read()[:n]
                except Exception:
                    return ''

            files = {}
            if os.path.exists('README.md'):
                files['README.md'] = read('README.md')

            if os.path.isdir('src'):
                for root, _, fnames in os.walk('src'):
                    for f in fnames:
                        if f.endswith('.py'):
                            p = os.path.join(root, f)
                            files[p] = read(p)

            if os.path.isdir('tests'):
                for root, _, fnames in os.walk('tests'):
                    for f in fnames:
                        if f.endswith('.py'):
                            p = os.path.join(root, f)
                            files[p] = read(p)

            system_msg = (
                "Você é um gerador de documentação técnica. Analise o código e gere documentação legível em Markdown. "
                "Retorne APENAS um JSON válido onde cada chave é um caminho em 'docs/' e cada valor é uma string Markdown com documentação legível. "
                "Evite retornar código fonte bruto ou JSON nos valores; se necessário, inclua exemplos de código dentro de blocos de código Markdown. "
                "Não inclua explicações fora do JSON."
            )

            user_msg = "Gere ou atualize a documentação para este repositório com base nos arquivos (resumidos):\n" + json.dumps(files, ensure_ascii=False)

            payload = {"model": "llama-3.1-8b-instant", "messages": [{"role": "system", "content": system_msg}, {"role": "user", "content": user_msg}]}

            groq_key = os.environ.get('GROCK_API_KEY', '')
            if not groq_key:
                print('GROCK_API_KEY não definido. Abortando.', file=sys.stderr)
                sys.exit(1)

            cmd = [
                'curl', '-s', 'https://api.groq.com/openai/v1/chat/completions',
                '-H', 'Content-Type: application/json',
                '-H', f'Authorization: Bearer {groq_key}',
                '-d', json.dumps(payload, ensure_ascii=False)
            ]

            resp = subprocess.check_output(cmd, text=True)
            try:
                j = json.loads(resp)
                content = j.get('choices', [{}])[0].get('message', {}).get('content', '')
            except Exception as e:
                print('Erro ao interpretar resposta da API:', e, file=sys.stderr)
                print(resp)
                sys.exit(1)

            # Try parsing response as JSON mapping path->markdown
            try:
                docs = json.loads(content)
                if not isinstance(docs, dict):
                    raise ValueError("Resposta JSON não é um objeto mapeamento")
            except Exception:
                # fallback: convert the content into a single Markdown document
                print("Resposta não é JSON mapeado; solicitando conversão para Markdown legível (fallback)")
                fallback_system = "Você é um transformador que converte qualquer entrada (código, JSON, logs) em um único documento Markdown legível. Retorne apenas o Markdown como texto, sem JSON."
                fallback_user = "Transforme o seguinte conteúdo em um documento Markdown legível:\n\n" + content
                payload2 = {"model": "llama-3.1-8b-instant", "messages": [{"role": "system", "content": fallback_system}, {"role": "user", "content": fallback_user}]}
                cmd2 = [
                    'curl', '-s', 'https://api.groq.com/openai/v1/chat/completions',
                    '-H', 'Content-Type: application/json',
                    '-H', f'Authorization: Bearer {groq_key}',
                    '-d', json.dumps(payload2, ensure_ascii=False)
                ]
                resp2 = subprocess.check_output(cmd2, text=True)
                try:
                    j2 = json.loads(resp2)
                    md = j2.get('choices', [{}])[0].get('message', {}).get('content', '')
                except Exception as e:
                    print('Erro no fallback:', e, file=sys.stderr)
                    print(resp2)
                    sys.exit(1)
                os.makedirs('docs', exist_ok=True)
                with open('docs/AI_OUTPUT.md', 'w', encoding='utf-8') as fh:
                    fh.write(md)
                print('Wrote docs/AI_OUTPUT.md (fallback)')
                sys.exit(0)

            # Write files
            for path, text in docs.items():
                if not path.startswith('docs/'):
                    path = os.path.join('docs', path)
                os.makedirs(os.path.dirname(path), exist_ok=True)
                with open(path, 'w', encoding='utf-8') as fh:
                    fh.write(text)
                print('Wrote', path)

            # Commit when changes
            subprocess.check_call(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
            subprocess.check_call(['git', 'config', 'user.name', 'github-actions[bot]'])
            status = subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
            if status:
                subprocess.check_call(['git', 'add', 'docs'])
                branch = os.environ.get('GITHUB_REF', 'refs/heads/HEAD').rsplit('/', 1)[-1]
                msg = 'docs: Atualização automática de documentação via IA'
                subprocess.check_call(['git', 'commit', '-m', msg])
                subprocess.check_call(['git', 'push', 'origin', branch])
                print('Docs committed and pushed.')
            else:
                print('Nenhuma alteração nos docs.')
          PY
          for path, text in docs.items():
              if not path.startswith('docs/'):
                  path = os.path.join('docs', path)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as fh:
                  fh.write(text)
              print('Wrote', path)

          # Commit quando houver mudanças
          subprocess.check_call(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'])
          subprocess.check_call(['git','config','user.name','github-actions[bot]'])
          status = subprocess.check_output(['git','status','--porcelain'], text=True).strip()
          if status:
              subprocess.check_call(['git','add','docs'])
              branch = os.environ.get('GITHUB_REF','refs/heads/HEAD').rsplit('/',1)[-1]
              msg = 'docs: Atualização automática de documentação via IA'
              subprocess.check_call(['git','commit','-m', msg])
              subprocess.check_call(['git','push','origin', branch])
              print('Docs committed and pushed.')
          else:
              print('Nenhuma alteração nos docs.')
          PY
